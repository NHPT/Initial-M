name: Security Audit

on:
  push:
    branches:
      - master
      - dev
      - 'fix/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Syntax Check (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.1'
          - '8.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --error \
            --exclude '.git' \
            --exclude 'vendor'

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
